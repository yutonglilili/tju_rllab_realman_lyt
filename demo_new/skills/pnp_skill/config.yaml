# pnp skill 默认配置文件

# ═══════════════════════════════════════════════════
# 感知参数
# ═══════════════════════════════════════════════════
PERCEPTION_INTERVAL: 0.3          # 打点频率(秒)，取决于 VLM 推理速度
TASK_DISCOVERY_INTERVAL: 2.0      # 没任务时监视频率

BUFFER_SIZE: 5                    # 移动检测缓冲区大小
TRIGGER_COUNT_THRESHOLD: 2        # 连续触发2次才认为目标移动
MOVE_OBJECT_THRESHOLD: 0.05       # pick 目标移动检测阈值(米，5cm)
MOVE_CONTAINER_THRESHOLD: 0.2     # place 目标移动检测阈值(米，20cm)

CAMERA_X_OFFSET: 0.05           # 修正相机标定x轴偏移(米)
CAMERA_Y_OFFSET: -0.01           # 修正相机标定y轴偏移(米)
CAMERA_Z_OFFSET: 0.0              # 修正相机标定z轴偏移(米)

PICK_SUCCESS_DIST_THRESHOLD: 0.1  # 抓取成功距离阈值(米)
PLACE_SUCCESS_DIST_THRESHOLD: 0.2 # 放置成功距离阈值(米)

# 保存图片目录
SAVE_DIR: "/home/lyt/tju_rllab_realman_lyt/demo_new/save_images/"

# ═══════════════════════════════════════════════════
# 规划参数
# ═══════════════════════════════════════════════════
TRAJECTORY_DOWNSAMPLE: 2          # 轨迹降采样率

SAFE_HEIGHT: 0.06                 # 安全高度(米)

# 设置固定 rpy, 如果为 null 则根据 xyz 计算角度
PICK_RPY: null
PLACE_RPY: null

# 根据 xyz 预设角度
RX_DEGREE_CLOSE: 10
RX_DEGREE_FAR_HIGH: 45
RX_DEGREE_FAR_LOW: 30

# pick 和 place 三阶段的位姿偏移
PRE_PICK_X_OFFSET: 0.0
PRE_PICK_Y_OFFSET: 0.04
PRE_PICK_Z_OFFSET: 0.08
PICK_X_OFFSET: 0.0
PICK_Y_OFFSET: 0.0
PICK_Z_OFFSET: -0.02
POST_PICK_X_OFFSET: 0.0
POST_PICK_Y_OFFSET: 0.04
POST_PICK_Z_OFFSET: 0.1
PRE_PLACE_X_OFFSET: 0.0
PRE_PLACE_Y_OFFSET: 0.04
PRE_PLACE_Z_OFFSET: 0.08
PLACE_X_OFFSET: 0.0
PLACE_Y_OFFSET: 0.0
PLACE_Z_OFFSET: 0.09
POST_PLACE_X_OFFSET: 0.0
POST_PLACE_Y_OFFSET: 0.0
POST_PLACE_Z_OFFSET: 0.1

# ═══════════════════════════════════════════════════
# 执行参数
# ═══════════════════════════════════════════════════
CONTROL_INTERVAL: 0.0              # 执行线程循环间隔（秒），sync 模式下 movep 本身阻塞，此值仅为防空转

GRIPPER_OPEN: 0.09                 # 夹爪张开程度
GRIPPER_CLOSE: 0.03                # 夹爪闭合程度   

# 连续运动失败（SyncController 抛 RuntimeError）达到此次数则放弃本段轨迹，触发 need_replan 重新规划
MAX_CONSECUTIVE_MOTION_FAILURES: 5

MAX_PICK_RETRIES: 5                # pick 阶段最大重试次数
MAX_PLACE_RETRIES: 5               # place 阶段最大重试次数

# 检测开关（1: 自动化检测, 2: 跳过检测, 3: 人工检测）
CHECK_PICK_SUCCESS_MODE: 1
CHECK_PLACE_SUCCESS_MODE: 1

# 检测失败时保存传入模型的图片（true: 保存, false: 不保存）
SAVE_CHECK_FAIL_IMAGE: true

# 检测裁剪区域大小
CHECK_PICK_CROP_SIZE: 560
CHECK_PLACE_CROP_SIZE: 640

# ═══════════════════════════════════════════════════
# Wrist GraspGen 参数
# ═══════════════════════════════════════════════════
GRASPGEN_SERVER_HOST: "127.0.0.1"
GRASPGEN_SERVER_PORT: 5556
GRASPGEN_TIMEOUT_MS: 60000
GRASPGEN_GRASP_THRESHOLD: -1.0
GRASPGEN_NUM_GRASPS: 200
GRASPGEN_TOPK_NUM_GRASPS: 50
GRASPGEN_MAX_CANDIDATES: 5
# 调试开关：True 时在候选抓取姿态生成后立即退出，不进入真实抓取执行。
DEBUG_EXIT_AFTER_GRASP_CANDIDATES: false
GRASPGEN_CANDIDATE_PREGRASP_OFFSET_M: 0.10

WRIST_MIN_DEPTH_M: 0.10
WRIST_MAX_DEPTH_M: 1.20
WRIST_DEPTH_PATCH_RADIUS: 3
WRIST_CLICK_SEED_RADIUS_PX: 5
WRIST_SEED_SEARCH_RADIUS_PX: 15
WRIST_REGION_GROW_NEIGHBOR_RADIUS_PX: 2
WRIST_REGION_GROW_3D_THRESHOLD_M: 0.018
WRIST_REGION_GROW_DEPTH_THRESHOLD_M: 0.030
WRIST_REGION_GROW_COLOR_THRESHOLD: 140.0
WRIST_REGION_GROW_MAX_SEED_DISTANCE_M: 0.24
WRIST_MIN_MASK_PIXELS: 120
WRIST_MASK_KERNEL_SIZE: 3
WRIST_TABLE_HEIGHT_PERCENTILE: 8.0
WRIST_TABLE_REMOVE_MARGIN_M: 0.008
WRIST_MAX_OBJECT_POINTS: 4096
WRIST_OBJECT_VOXEL_SIZE: 0.003
WRIST_MAX_SCENE_POINTS: 8192
WRIST_SCENE_VOXEL_SIZE: 0.004

GRASPGEN_DIRECTION_RULE_TARGET_DIR_CAMERA: [0.0, 0.64, 0.77]
GRASPGEN_DIRECTION_RULE_MAX_ANGLE_DEG: 35.0
GRASPGEN_DIRECTION_RULE_MIN_FORWARD_COMPONENT: 0.30
GRASPGEN_DIRECTION_RULE_MIN_DOWN_COMPONENT: 0.20
GRASPGEN_DIRECTION_RULE_MAX_LATERAL_COMPONENT: 0.45
